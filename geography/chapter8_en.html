<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Economy and Occupations - Self Study</title>
    <style>
        :root {
    --primary-color: #0052D4;
    --secondary-color: #38B6FF;
    --bg-color: #FFFFFF;
    --text-color: #1D2335;
    --muted-bg: #F0F4F8;
    --white-text: #FFFFFF;
    --correct-bg: #E6F7EE;
    --correct-border: #2BB673;
}
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', 'Nirmala UI', Tahoma, Geneva, Verdana, sans-serif; }
body { background-color: var(--muted-bg); color: var(--text-color); min-height: 100vh; }

.app-header {
    background-color: var(--primary-color);
    padding: 30px 24px;
    color: var(--white-text);
    position: relative;
    border-bottom-left-radius: 32px;
    border-bottom-right-radius: 32px;
}
.header-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
.back-btn {
    background-color: rgba(255,255,255,0.2); color: var(--white-text); border: none;
    width: 42px; height: 42px; border-radius: 50%; font-size: 20px; font-weight: 700;
    cursor: pointer; line-height: 42px;
}
.header-label { font-weight: 700; font-size: 14px; letter-spacing: 0.5px; }
.header-content { margin-top: 8px; }
.app-title { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: var(--secondary-color); font-weight: 700; margin-bottom: 8px; }
.main-heading { font-size: 24px; font-weight: 700; line-height: 1.3; }

.content-body { padding: 28px 24px 48px 24px; max-width: 640px; margin: 0 auto; }

.subtitle-banner {
    background-color: var(--bg-color); border-radius: 16px; padding: 14px 18px; margin-bottom: 18px;
    box-shadow: 0 4px 12px rgba(29,35,53,0.04); font-size: 13px; color: #7E8B9B; font-weight: 600;
}

.filter-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
.pill {
    background-color: var(--muted-bg); color: var(--text-color); border: none;
    padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer;
    transition: all 0.2s ease;
}
.pill.active { background-color: var(--primary-color); color: var(--white-text); }
.pill:hover { background-color: var(--secondary-color); color: var(--white-text); }

.section-block { margin-bottom: 26px; }
.section-title-bar {
    display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 700;
    color: var(--primary-color); margin-bottom: 14px;
}
.section-dot { width: 10px; height: 10px; border-radius: 50%; background-color: var(--secondary-color); }

.qa-card {
    background-color: var(--bg-color); border-radius: 16px; margin-bottom: 12px;
    box-shadow: 0 4px 12px rgba(29,35,53,0.04); overflow: hidden; border: 1px solid rgba(240,244,248,0.9);
}
.qa-header {
    width: 100%; display: flex; align-items: flex-start; gap: 12px; text-align: left;
    background: none; border: none; padding: 16px 18px; cursor: pointer; font-family: inherit;
}
.qa-num {
    flex: 0 0 auto; width: 28px; height: 28px; border-radius: 50%; background-color: var(--muted-bg);
    color: var(--primary-color); font-weight: 700; font-size: 14px; line-height: 28px; text-align: center;
}
.qa-q { flex: 1; text-align: left; font-size: 15px; font-weight: 600; line-height: 1.5; color: var(--text-color); }
.qa-toggle { flex: 0 0 auto; font-size: 22px; font-weight: 700; color: var(--primary-color); line-height: 1; transition: transform 0.25s ease; }
.qa-card.open .qa-toggle { transform: rotate(45deg); }

.qa-body { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; }
.qa-inner { padding: 0 18px 18px 18px; text-align: left; }
.options { list-style: none; margin: 6px 0 12px 0; }
.options .opt { padding: 8px 12px; border-radius: 10px; background-color: var(--muted-bg); margin-bottom: 6px; font-size: 14px; }
.options .opt.correct { background-color: var(--correct-bg); border: 1px solid var(--correct-border); font-weight: 600; }
.ans-label { font-size: 14px; font-weight: 700; color: var(--text-color); margin-bottom: 6px; }
.ans-label span { color: var(--correct-border); }
.explain { font-size: 14px; line-height: 1.7; color: #4A5568; }
.answer-text { font-size: 14px; line-height: 1.8; color: #2D3748; }

.hidden { display: none !important; }
    </style>
</head>
<body>
    <header class="app-header">
        <div class="header-nav">
            <button class="back-btn" onclick="goBack()">←</button>
            <span class="header-label">Chapter 8</span>
        </div>
        <div class="header-content">
            <p class="app-title">Geography Stream</p>
            <h1 class="main-heading">Economy and Occupations</h1>
        </div>
    </header>

    <main class="content-body">
        <div class="subtitle-banner">Chapter 08 • Gross GDP & Workforce Sectors</div>

        <div class="filter-bar"><button class="pill active" data-filter="all" onclick="filterQA('all', this)">All</button><button class="pill" data-filter="note" onclick="filterQA('note', this)">Study Notes</button></div>

        <div id="sectionsContainer">
            <div class="section-block" data-type="note">
                <div class="section-title-bar"><span class="section-dot"></span>Chapter Notes</div>
                <div class="section-qs">
                <div class="qa-card" data-type="note">
                    <button class="qa-header" onclick="toggleQA('q-note-1-0')" aria-expanded="false">
                        <span class="qa-num">1</span>
                        <span class="qa-q">Economy and Occupations</span>
                        <span class="qa-toggle">+</span>
                    </button>
                    <div class="qa-body" id="q-note-1-0">
                        <div class="qa-inner">
                    <div class="answer-text">Detailed concepts and study material for this chapter will be available soon.</div>
                </div>
                    </div>
                </div>
            </div>
            </div>
        </div>
    </main>

    <script>
function goBack() {
    if (window.history.length > 1) { window.history.back(); }
    else { window.location.href = './geographychapters_en.html'; }
}
function toggleQA(id) {
    var body = document.getElementById(id);
    var card = body.parentElement;
    if (body.style.maxHeight && body.style.maxHeight !== '0px') {
        body.style.maxHeight = '0px';
        card.classList.remove('open');
    } else {
        body.style.maxHeight = body.scrollHeight + 'px';
        card.classList.add('open');
    }
}
function filterQA(type, el) {
    document.querySelectorAll('.pill').forEach(function(p){ p.classList.remove('active'); });
    el.classList.add('active');
    document.querySelectorAll('.section-block').forEach(function(sec){
        if (type === 'all' || sec.getAttribute('data-type') === type) {
            sec.classList.remove('hidden');
        } else {
            sec.classList.add('hidden');
        }
    });
}
window.onload = function(){
    document.querySelectorAll('.qa-body').forEach(function(b){ b.style.maxHeight = '0px'; });
};
    </script>
</body>
</html>
